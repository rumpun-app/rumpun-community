        page: { $ref: '#/components/schemas/Page' }
    Diagnostic:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [info, warning, error] }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        message: { type: string }
        line: { type: [integer, 'null'], minimum: 1 }
