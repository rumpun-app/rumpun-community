      type: object
      required: [id, treeId, status, createdAt, diagnostics]
      properties:
        id: { type: string, format: uuid }
        treeId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        detectedVersion: { type: [string, 'null'] }
        analysisRevision: { type: [string, 'null'] }
        summary:
          type: object
          properties:
            recordsRead: { type: integer, minimum: 0 }
            peopleProposed: { type: integer, minimum: 0 }
            relationshipsProposed: { type: integer, minimum: 0 }
            factsProposed: { type: integer, minimum: 0 }
            unsupportedTags: { type: integer, minimum: 0 }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/Diagnostic' } }
        duplicateCandidates: { type: array, items: { $ref: '#/components/schemas/DuplicateCandidate' } }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    GedcomExportJob:
      type: object
      required: [id, treeId, status, version, createdAt, diagnostics]
      properties:
        id: { type: string, format: uuid }
        treeId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        version: { type: string }
        downloadUrl: { type: [string, 'null'], format: uri }
        downloadExpiresAt: { type: [string, 'null'], format: date-time }
        diagnostics: { type: array, items: { $ref: '#/components/schemas/Diagnostic' } }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    ValidationError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: JSON Pointer or parameter name }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        traceId: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/ValidationError' } }
    DuplicateProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [candidates]
          properties:
            candidates: { type: array, items: { $ref: '#/components/schemas/DuplicateCandidate' } }
