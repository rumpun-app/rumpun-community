name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include real family data or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and context
      description: Include version, deployment context, logs, or screenshots with personal data removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no real family or personal data.
          required: true